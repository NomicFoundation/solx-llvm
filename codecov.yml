codecov:
  require_ci_to_pass: no

coverage:
  status:
    project:
      default: false  # disable the default status that measures entire project
    patch:
      default: false  # disable the patch status that measures patch changes

# Coverage arrives only from solx's main pushes, so no pull request here
# gets a report to comment on.
comment: false

# The fork code solx exercises.
component_management:
  individual_components:
    - component_id: evm-backend
      name: EVM backend
      paths:
        - llvm/lib/Target/EVM/**
    - component_id: sol-dialect
      name: Sol dialect
      paths:
        - mlir/lib/Dialect/Sol/**
    - component_id: yul-dialect
      name: Yul dialect
      paths:
        - mlir/lib/Dialect/Yul/**
    - component_id: sol-to-yul
      name: SolToYul
      paths:
        - mlir/lib/Conversion/SolToYul/**
    - component_id: yul-to-standard
      name: YulToStandard
      paths:
        - mlir/lib/Conversion/YulToStandard/**
    - component_id: evm-linker
      name: EVM linker
      paths:
        - lld/lld-c/**
        - lld/ELF/Arch/EVM.cpp
    - component_id: sol-yul-c-api
      name: Sol and Yul C API
      paths:
        - mlir/lib/CAPI/Dialect/Sol.cpp
        - mlir/lib/CAPI/Dialect/SolPasses.cpp
        - mlir/lib/CAPI/Dialect/Yul.cpp
        - mlir/lib/CAPI/Dialect/YulPasses.cpp
    - component_id: evm-ir-passes
      name: EVM IR passes
      paths:
        - llvm/lib/Analysis/VMAliasAnalysis.cpp
        - llvm/lib/Support/KECCAK.cpp
        - llvm/lib/Transforms/Scalar/MergeIdenticalBB.cpp
        - llvm/lib/Transforms/Scalar/SHA3ConstFolding.cpp
