# Validates renovate.json on every PR that touches it — schema check plus a
# full extraction dry-run, so malformed rules and silent detection failures
# (e.g. a pip-compile header Renovate can't parse) surface before merge.

name: Check Renovate config

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/check-renovate-config.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-renovate-config:
    name: Check Renovate config
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: "44.175.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-24.04's default Node 20 is too old for the pinned renovate
      # (engines: node ^24.11).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Renovate schema check
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator renovate.json

      - name: Renovate extraction dry-run
        env:
          # Without a token, github-tags/github-releases lookups hit the
          # anonymous 60 req/hr rate limit shared across the runner IP.
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: debug
        run: npx --yes "renovate@${RENOVATE_VERSION}" --platform=local --dry-run=full
